<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search — Sandbox Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; margin-bottom: 1.5rem; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .note h3 { margin: 0 0 0.5rem; }
    a.btn { display: inline-block; background: #1a2540; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Search Results</h1>

  <form action="{{ url_for('search') }}" method="get" style="margin-bottom: 1rem;">
    <input name="q" type="search" value="{{ query|e }}" placeholder="Search notes…"
           style="padding: 0.45rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;">
    <button type="submit"
            style="padding: 0.45rem 1rem; background: #1a2540; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem;">
      Search
    </button>
  </form>

  <p class="meta">{{ results|length }} result(s) for "<strong>{{ query }}</strong>"</p>

  {% if results %}
    {% for note in results %}
      <div class="note">
        <h3>{{ note.title }}</h3>
        <p>{{ note.body }}</p>
      </div>
    {% endfor %}
  {% else %}
    <p>No notes matched your search.</p>
  {% endif %}

  <a class="btn" href="{{ url_for('home') }}" style="margin-top: 1rem;">← All notes</a>
</body>
</html>
